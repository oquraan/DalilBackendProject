<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body style="background-color:#f9f9fd">
  <header></header>

  <main>
    <div id="cards">
      <div class="  omar-spinner"></div>

    </div>

    <form class="container mt-5 p-4 bg-white rounded shadow-sm border ">
      <div class="row g-3">

        <div class="col-md-4 col-">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" class="form-control" placeholder="Lunch">
        </div>

        <div class="col-md-2">
          <label for="amount" class="form-label">Amount</label>
          <input type="number" id="amount" class="form-control" placeholder="0.00">
        </div>

        <div class="col-md-3">
          <label for="category" class="form-label">Category</label>
          <select id="category" class="form-select">
            <option value="" selected disabled>Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>

          </select>
        </div>

        <div class="col-md-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" id="date" class="form-control">
        </div>

      </div>

      <div class="mt-4 text-end">
        <button type="submit" class="btn btn-primary px -4 addExpense">Add Expense</button>
      </div>
    </form>
    <div class=" container mt-5 rounded">
      <div class="  omar-spinner"></div>
      <div class="container mt-5 p-4 bg-white rounded shadow-sm border">
        <div class="row">
          <div class="col-md-3 m-3">
            <label for="categoryFilter" class="form-label">Category</label>
            <select id="categoryFilter" class="form-select">
              <option value="" selected>All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>

            </select>
          </div>
          <div class="col-md-3 m-3">
            <label for="monthFilter" class="form-label">Month</label>
            <select id="monthFilter" class="form-select" aria-label="Month filter">
              <option value="" selected>All Months</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>

          <div class="col-md-3 m-3">
            <label for="TitleForm" class="form-label">
              Title
            </label>
            <input id="TitleForm" type="text" class="form-control">
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover tablerows align-middle">
            <thead id="tableHeader">
              <tr>
                <th id="titleColumn" style="cursor:pointer; color:#000000;">Title ↕</th>
                <th id="amountColumn" style="cursor:pointer; color:#000000;">Amount ↕</th>
                <th id="categoryColumn" style="cursor:pointer; color:#000000;">Category ↕</th>
                <th id="dateColumn" style="cursor:pointer; color:#000000;">Date ↕</th>
                <th style="color:#000000;">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div>
      <canvas id="myChart"></canvas>
    </div>


    <div id="updateBox"
      style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 1000;">

      <h3>Update Expense</h3>
      <input type="hidden" id="boxId">

      <div>
        <label>Title:</label><br>
        <input type="text" id="boxTitle">
      </div>
      <br>
      <div>
        <label>Amount:</label><br>
        <input type="number" id="boxAmount">
      </div>
      <div>
        <label>date:</label><br>
        <input type="date" id="boxDate">
      </div>
      <div>
        <label for="boxCategory" class="form-label">Category</label>
        <select id="boxCategory" class="form-select">
          <option value="" selected disabled>Select Category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>

        </select>
      </div>
      <br>
      <button id="saveBtn" class="btn btn-success">Save</button>
      <button id="closeBtn" class="btn btn-danger">Cancel</button>

    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script  type="module" src="js/expenses.js"></script>
  <script  type="module" src="js/chart.js"></script>

</body>

</html>
